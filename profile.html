<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil Siswa — Publik</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      /* (sederhana) — salin style dari file original atau pakai style di bawah */
      body {
        font-family: Poppins, sans-serif;
        background: #111;
        color: #fff;
        padding: 24px;
      }
      .card {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .qr-img {
        width: 150px;
        height: 150px;
        object-fit: contain;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        padding: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        color: #fff;
      }
      table th,
      table td {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        text-align: left;
      }
      .text-muted {
        color: #cfcfcf;
        font-size: 0.9rem;
      }
      .btn {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 8px;
        background: #2b8;
        color: #000;
        text-decoration: none;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="display: flex; gap: 16px; align-items: center">
        <img id="logo" src="Logo Cadenza.jpg" alt="logo" class="qr-img" />
        <div>
          <h2 id="fNama">-</h2>
          <div id="fInstrumen" class="text-muted">-</div>
          <div id="fPaket" class="text-muted">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Informasi</h3>
      <div class="text-muted">Jenis Kelamin: <span id="fJK">-</span></div>
      <div class="text-muted">
        Tempat/Tanggal Lahir: <span id="fTTL">-</span>
      </div>
      <div class="text-muted">Alamat: <span id="fAlamat">-</span></div>
      <div class="text-muted">Kontak: <span id="fTelp">-</span></div>
      <div class="text-muted">
        Ortu/Wali: <span id="fOrtu">-</span> <span id="fTelpOrtu"></span>
      </div>
    </div>

    <div class="card">
      <h3>Riwayat Nilai <small id="countNilai" class="text-muted"></small></h3>
      <table id="nilaiTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Tanggal</th>
            <th>Instrumen</th>
            <th>Instruktur</th>
            <th>Predikat</th>
            <th>Materi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div style="margin-top: 12px">
      <a id="btnCopyUrl" class="btn">Salin URL Profil</a>
      <a id="btnPrint" class="btn">Cetak</a>
    </div>

    <!-- gunakan path ke firebase.js yang kamu upload; contoh path lokal server: /mnt/data/firebase.js -->
    <script type="module">
      // **GANTI PATH** jika firebase.js disimpan di lokasi lain di server
      import { getStudent, onNilaiSnapshot } from "/mnt/data/firebase.js"; // <-- path file firebase.js di servermu
      // jika environment kamu pakai relative, bisa: "./firebase.js"

      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const profileUrl = window.location.href;

      if (!id) {
        document.querySelector("#nilaiTable tbody").innerHTML =
          '<tr><td colspan="6" class="text-center text-muted">Buka halaman ini dengan parameter <code>?id=ID_SISWA</code></td></tr>';
      } else {
        // ambil data siswa
        getStudent(id).then((s) => {
          if (!s) {
            document.getElementById("fNama").textContent =
              "Profil tidak ditemukan";
            return;
          }
          document.getElementById("fNama").textContent = s.namaSiswa || "-";
          document.getElementById("fJK").textContent = s.jenisKelamin || "-";
          document.getElementById("fTTL").textContent =
            (s.tempatLahir || "-") + ", " + (s.tanggalLahir || "-");
          document.getElementById("fAlamat").textContent = s.alamat || "-";
          document.getElementById("fTelp").textContent = s.noTelepon || "-";
          document.getElementById("fOrtu").textContent = s.namaOrtu || "-";
          document.getElementById("fTelpOrtu").textContent =
            s.noTeleponOrtu || "";
          document.getElementById("fInstrumen").textContent = Array.isArray(
            s.pilihanIstrumen
          )
            ? s.pilihanIstrumen.join(", ")
            : s.pilihanIstrumen || "-";
          document.getElementById("fPaket").textContent = s.pilihanPaket || "-";
        });

        // realtime nilai (akan berjalan tanpa auth jika rules mengizinkan)
        onNilaiSnapshot((list) => {
          const tbody = document.querySelector("#nilaiTable tbody");
          const data = list.filter((n) => n.siswaId === id);

          // urutkan terbaru dulu
          data.sort((a, b) => {
            const ta = a.tanggal ? new Date(a.tanggal) : new Date(0);
            const tb = b.tanggal ? new Date(b.tanggal) : new Date(0);
            return tb - ta;
          });

          document.getElementById(
            "countNilai"
          ).textContent = `${data.length} nilai`;

          tbody.innerHTML = data
            .map((d, i) => {
              const materiHTML = Array.isArray(d.materi)
                ? d.materi.map((m) => (m || "").toString().trim()).join("<br>")
                : String(d.materi || "").replace(/\n/g, "<br>");
              return `
                <tr>
                  <td>${i + 1}</td>
                  <td>${d.tanggal || "-"}</td>
                  <td>${d.instrumen || "-"}</td>
                  <td>${d.instruktur || "-"}</td>
                  <td>${d.predikat || "-"}</td>
                  <td>${materiHTML}</td>
                </tr>
              `;
            })
            .join("");
        });
      }

      // tombol salin & cetak
      document
        .getElementById("btnPrint")
        .addEventListener("click", () => window.print());
      document
        .getElementById("btnCopyUrl")
        .addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(profileUrl);
            Swal.fire(
              "Disalin!",
              "URL profil telah disalin ke clipboard.",
              "success"
            );
          } catch (e) {
            Swal.fire("Gagal", "Tidak dapat menyalin URL.", "error");
          }
        });
    </script>
  </body>
</html>
